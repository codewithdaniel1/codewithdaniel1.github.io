  <rect x="28" y="24" width="464" height="252" fill="#faf9f4" stroke="#cdd2c5"/>
  <text x="48" y="50" fill="#24352c" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.3">NETWORK FLOWS / EXPLAINABLE DETECTION</text>
  <path d="M48 64h424" stroke="#cdd2c5"/>
  <g fill="#496a53" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing=".7">
    <text x="48" y="87">FLOW RECORDS</text><text x="190" y="87">DETECTION SIGNALS</text><text x="350" y="87">MODEL REVIEW</text>
  </g>
