  <g fill="#4f5e54" font-family="DM Sans,Arial,sans-serif" font-size="9"><text x="72" y="121">source → service</text><text x="72" y="146">source → service</text><text x="72" y="171">source → service</text><text x="72" y="196">source → service</text></g>
  <g stroke-linecap="round" stroke-width="3"><path d="M72 128h74M72 153h48M72 178h64M72 203h38" stroke="#cdd2c5"/></g>
