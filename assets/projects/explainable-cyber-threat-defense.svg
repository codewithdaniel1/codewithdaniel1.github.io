<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Open-world network-flow triage</title>
  <desc id="desc">A held-out attack category is evaluated using separate known-risk and novelty rankings that feed a fixed-budget review queue.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d8dbd0" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#a37157"/></marker>
  </defs>
  <rect width="520" height="300" fill="#ebe6d9"/><rect width="520" height="300" fill="url(#grid)"/>
  <rect x="28" y="24" width="464" height="252" fill="#faf9f4" stroke="#cdd2c5"/>
  <text x="48" y="50" fill="#24352c" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.3">OPEN-WORLD TRIAGE / FIXED REVIEW BUDGET</text>
  <path d="M48 64h424" stroke="#cdd2c5"/>
  <g fill="#496a53" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing=".6">
    <text x="48" y="89">FLOW FEATURES</text><text x="210" y="89">SEPARATE RANKINGS</text><text x="370" y="89">REVIEW QUEUE</text>
  </g>
  <rect x="46" y="101" width="118" height="119" fill="#f4f2ea" stroke="#cdd2c5"/>
  <text x="60" y="124" fill="#4f5e54" font-family="DM Sans,Arial,sans-serif" font-size="9">UNSW-NB15</text>
  <g stroke="#cdd2c5" stroke-width="2" stroke-linecap="round"><path d="M60 141h83M60 158h61M60 175h74M60 192h54"/></g>
  <circle cx="145" cy="196" r="5" fill="#a37157"/><text x="60" y="211" fill="#a37157" font-family="IBM Plex Mono,monospace" font-size="7">HELD-OUT CATEGORY</text>
  <path d="M165 160h22" fill="none" stroke="#a37157" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="194" y="105" width="142" height="48" fill="#f4f2ea" stroke="#cdd2c5"/><rect x="194" y="169" width="142" height="48" fill="#f4f2ea" stroke="#cdd2c5"/>
  <text x="207" y="124" fill="#496a53" font-family="IBM Plex Mono,monospace" font-size="7" letter-spacing=".4">KNOWN-RISK LANE</text><text x="207" y="142" fill="#24352c" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600">Seen attack patterns</text>
  <text x="207" y="188" fill="#a37157" font-family="IBM Plex Mono,monospace" font-size="7" letter-spacing=".4">NOVELTY LANE</text><text x="207" y="206" fill="#24352c" font-family="DM Sans,Arial,sans-serif" font-size="10" font-weight="600">Unusual vs. normal</text>
  <path d="M338 129h20M338 193h20" fill="none" stroke="#a37157" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="365" y="121" width="104" height="75" fill="#ebe6d9" stroke="#cdd2c5"/>
  <text x="377" y="142" fill="#496a53" font-family="IBM Plex Mono,monospace" font-size="7" letter-spacing=".4">FIXED CAPACITY</text>
  <text x="377" y="163" fill="#24352c" font-family="DM Sans,Arial,sans-serif" font-size="13" font-weight="600">10% review</text>
  <path d="M378 177h72" stroke="#718368" stroke-width="5" stroke-linecap="round"/><path d="M432 177h18" stroke="#a37157" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 235h424" stroke="#cdd2c5"/>
  <text x="48" y="256" fill="#496a53" font-family="IBM Plex Mono,monospace" font-size="8" letter-spacing=".7">KNOWN-RISK VS NOVELTY · EQUAL-SIZE QUEUES · UNSW-NB15</text>
</svg>
